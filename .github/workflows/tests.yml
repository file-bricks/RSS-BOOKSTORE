name: RSS-BOOKSTORE tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest ruff

      - name: Check Python compilation
        run: python -m compileall native_host tests

      - name: Run Ruff static linter
        run: ruff check .

      - name: Run JavaScript extension tests
        run: npm.cmd test

      - name: Run Python tests via pytest
        run: pytest
